<!doctype html>
<html><head><meta charset="utf-8"><title>选择器候选与稳定性 fixture</title></head>
<body>
<h1>selector candidates fixture</h1>

<!-- ── 1. 稳定标识：首选必须是它，评级 high ────────────────────────────── -->

<!-- 1a. 稳定 id（同时带 data-testid → alternates 里应有它，用来验顺序） -->
<button id="schedule-now" data-testid="schedule">Stable Id</button>

<!-- 1b. 五种标识俱全：验候选的**优先级顺序**（id > name > data-* > class > 结构路径）
         以及去重（pathSel 会再吐一个 `#full`，必须被滤掉） -->
<input id="full" name="full-name" data-testid="full-tid" class="form-control" type="text" placeholder="Full">

<!-- 1c. 只有 name（无 id）→ 首选必须是 [name=] -->
<input name="email-addr" type="text" placeholder="B stable name">

<!-- 1d. 只有 data-testid（无 id / name）→ 首选必须是 [data-testid=] -->
<button data-testid="go-btn">C data-testid</button>

<!-- ── 2. 随机 class hash：首选不得是它 ──────────────────────────────── -->

<!-- 2a. 7 位 base36 hash —— emotion / MUI v5 那类 CSS-in-JS 的形态
         （emotion 的 hash 是 murmur2 → toString(36)，通常 6~7 位。
          ⚠️ 这句「6~7 位」是本仓的既有知识，**没有在真站上核实过** ——
          核实它就是规格 R5 的活；能核实的是另一半：brief 把 `css-1x2y3z4`
         当成随机 hash 的字面例子）
         brief 的字面例子。修复轮 1 **之前**它没被 RAND 滤掉、直接当上首选选择器
         （button.css-1x2y3z4、medium）；修复轮 1 加了形态③之后被滤掉、退化成结构路径。 -->
<button class="css-1x2y3z4">D hash7</button>

<!-- 2b. 8 位纯 hex hash —— RAND 的 `[0-9a-f]{8,}` 正好咬得住的那一档 -->
<button class="css-1a2b3c4d">E hash8</button>

<!-- ── 3. 稳定语义 class（非 hash）→ medium ──────────────────────────── -->
<button class="btn btn-primary">F stable class</button>

<!-- ── 3b. 反向边界：这些类名**不得**被判成随机 token ──────────────────
     RAND 放宽（形态③：字母数字来回交替 ≥2 次）时最容易的翻车方式是
     **静默开始拒绝正常类名** —— 那会让 stability 全面变差、agent 选错。
     下面七个覆盖三个家族，每个元素**只带一个** class，好让「class 候选还在不在」
     一眼可判（selector 是不是 `button.<class>`）：
       无数字        btn-primary / hero-banner
       数字自成一段   col-md-6 / icon-24
       数字在词尾     step1 / section1 / text-2xl   ← 形态③ 的「交替 ≥2 次」专为这一家 -->
<button class="btn-primary">M btn-primary</button>
<button class="hero-banner">M hero-banner</button>
<button class="col-md-6">M col-md-6</button>
<button class="icon-24">M icon-24</button>
<button class="step1">M step1</button>
<button class="section1">M section1</button>
<button class="text-2xl">M text-2xl</button>

<!-- 3c. 反向边界（name 落点）：词尾带数字的 name 也不得被判随机 ——
     修复轮 1 给 name 补了 RAND，这道防线同样要有反向的一半 -->
<input name="step2" type="text" placeholder="M name step2">

<!-- ── 4. 深层结构路径：4 段（3 个 >）→ low ──────────────────────────
     每一层都是它父节点下**唯一**的同标签子元素，所以 nth-of-type 全是 (1)，
     选择器完全确定：section(1) > article(1) > div(1) > button(1) -->
<div><section><article><div>
  <button>G deep path no id</button>
</div></article></section></div>

<!-- ── 5. 以祖先稳定 id 开头的深路径（4 段）──────────────────────────
     pathSel 只爬 4 跳，第 4 跳撞上 #deep-wrap 就改吐 '#'+id 并停：
       #deep-wrap > div(1) > div(1) > button(1) -->
<div id="deep-wrap">
  <div><div>
    <button>H deep under stable id</button>
  </div></div>
</div>

<!-- ── 6. 真站上最常见：裸 <button>，没有任何标识 ────────────────────── -->
<button>I plain button</button>

<!-- ── 6b. 只有 id（没有 name / data-* / class）──────────────────────
     pathSel 第一跳就撞上它自己的 id → 吐 `#pure-id`；与首选逐字相同 →
     被去重滤掉 → **alternates 恒为空**。见报告「alternates 的结构性空洞」一节 -->
<button id="pure-id">L pure id</button>

<!-- ── 7. 随机 token 的落点（id / data-* / name）──────────────────────
     RAND 现为**三形态**（修复轮 1 加了③，定义与理由见 observe.go 的 RAND 上方注释）：
       形态① 被 -/_ 或串首尾夹住的 ≥8 位 hex 片段
       形态② 同上边界内的「可选字母前缀 + ≥6 位数字」
       形态③ 同上边界内、≥5 位、字母与数字**来回交替 ≥2 次**
     四个落点（id / name / data-* / class）**全部**过 RAND。 -->

<!-- 7a. 随机 id（形态①：串首尾夹住的 12 位 hex）—— id 这一路 RAND 是过的 -->
<button id="a1b2c3d4e5f6">J random id</button>

<!-- 7b. 随机 data-testid（形态②：字母 + 10 位数字）—— data-* 这一路 RAND 也是过的 -->
<button data-testid="x1234567890">K random tid</button>

<!-- 7c. 随机 name（形态①：`_` 夹住的 12 位 hex）—— name 这一路在**修复轮 1 之前没过 RAND**，
         是四处里唯一的漏网；修复轮 1 补齐后它退化成结构路径 -->
<input name="sid_9f8e7d6c5b4a" type="text" placeholder="K random name">

<!-- 7d. 只翻转一次的 hex（`abcdef` 全是字母、`1234` 全是数字，字母→数字只翻一次）
         —— 这个形态**只有形态①认得出**：③ 要「来回交替 ≥2 次」，② 要 ≥6 位数字。
         它的存在是为了**把形态①单独隔出来**：没有它，删掉①套件照样全绿
         （①原先独有的用例都被③接管了），①就成了没人守的孤儿代码。 -->
<button class="css-abcdef1234">N hex10 form1-only</button>

<!-- 7e. ③ 在 name 落点上的两个方向（协调者审查 ①：name 是这轮改动的落点，
         双向都得钉住）。取舍与理由写在 observe.go 的 name 那一行旁边 -->

<!-- 7e-1. 随机 name（形态③：字母数字交替）—— **必须丢** -->
<input name="a1b2c3" type="text" placeholder="N random name 3">

<!-- 7e-2. 人写的子字段名（`step2a` = 步骤2的第a个子字段）—— ③ 会把它也抓走。
         这是**已知且被接受的代价**：断言它确实退化成结构路径，而不是假装它没发生。
         真站上 `address1a` / `opt2b` 这一家会同样退化 → 记进残留清单，R5 校准。 -->
<input name="step2a" type="text" placeholder="N subfield name">

</body></html>
