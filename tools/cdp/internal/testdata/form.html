<div class="card" id="lead-card">
  <h3>Get your free quote</h3>
  <label for="fn">First Name</label><input id="fn" name="firstName" type="text" placeholder="First Name" required>
  <label for="ph">Phone</label><input id="ph" name="phone" type="tel" placeholder="Phone">
  <label for="st">State</label>
  <select id="st" name="state"><option value="">Choose</option><option value="GA">Georgia</option><option value="CA">California</option></select>
  <div class="opts" id="shower-opts">
    <button type="button">Tub to walk-in shower</button>
    <button type="button">I need help deciding</button>
  </div>
  <button id="submit" type="submit">Get My Quote</button>
</div>
